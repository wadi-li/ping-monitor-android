name: Android build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the personal APK signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - run: bash tools/test-core.sh
      - run: gradle --no-daemon --no-build-cache :app:assembleRelease :app:lintDebug
      - name: Verify stable APK signing identity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-report.txt
          grep -F '5f2486bed7801f2990bf2df4d8eb2dbead4cd914330032f4e24c4175804a03fd' signing-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ping-monitor-apk
          path: |
            app/build/outputs/apk/release/*.apk
            signing-report.txt
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant ru.limar.pingmonitor android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w ru.limar.pingmonitor.test/ru.limar.pingmonitor.SmokeInstrumentation | tee android-smoke.log
            grep -E 'PASS: .* Android instrumentation checks' android-smoke.log
            mkdir -p screenshots
            adb pull /sdcard/Android/data/ru.limar.pingmonitor/files/light.png screenshots/
            adb pull /sdcard/Android/data/ru.limar.pingmonitor/files/dark.png screenshots/
            adb pull /sdcard/Android/data/ru.limar.pingmonitor/files/notification-layout.png screenshots/
            adb pull /sdcard/Android/data/ru.limar.pingmonitor/files/compact.png screenshots/
            adb pull /sdcard/Android/data/ru.limar.pingmonitor/files/layout-light.png screenshots/
            adb pull /sdcard/Android/data/ru.limar.pingmonitor/files/layout-dark.png screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-results
          path: |
            android-smoke.log
            screenshots/
