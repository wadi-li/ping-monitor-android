name: Publish verified 1.0.0 APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-1.0.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source and download its APK
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/41856831278 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/41856831278 --jq .head_sha)" = 83ef3fa3d966d618e123c4e384afdee1d951952c
          gh run download 41856831278 --name ping-monitor-apk --dir "$RUNNER_TEMP/verified-apk"
          mkdir -p release
          cp "$RUNNER_TEMP/verified-apk/app/build/outputs/apk/release/app-release.apk" release/ping-monitor-1.0.0.apk
          cd release
          echo '045468cef41a71df673ee4a05208409875e4e3126e46ec9c8dfd1ec1265b1ae0  ping-monitor-1.0.0.apk' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish assets without rebuilding the verified binary
        run: |
          set -euo pipefail
          cp docs/USER_GUIDE.md release/ping-monitor-user-guide.md
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --draft --target b7dc9b7 --title 'Пинг-монитор 1.0.0' --notes-file docs/RELEASE_NOTES_1.0.0.md
          fi
          gh release upload v1.0.0 release/ping-monitor-1.0.0.apk release/ping-monitor-user-guide.md release/SHA256SUMS.txt --clobber
          gh release edit v1.0.0 --draft=false --title 'Пинг-монитор 1.0.0' --notes-file docs/RELEASE_NOTES_1.0.0.md
